<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Para ti 💛</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="fondo-fijo"></div>

    <main class="contenido">

        <h1 class="mensaje-amor">
            Te amo cariño
        </h1>

        <div class="galeria">

            <div
                id="foto1"
                class="foto activa"
            ></div>

            <div
                id="foto2"
                class="foto"
            ></div>

        </div>

    </main>

    <div class="controles-musica">

        <button
            id="playPausa"
            aria-label="Reproducir música"
        >
            <span class="icono-play"></span>

            <span class="icono-pausa">
                <span></span>
                <span></span>
            </span>

        </button>

        <button
            id="segundo46"
            aria-label="Ir al segundo 46"
        >
            <span class="corazon">♥</span>
        </button>

    </div>

    <audio id="musica" loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>

</body>

</html>
